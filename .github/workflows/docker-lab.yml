name: FSRsync Docker Lab CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run nightly tests at 2 AM UTC
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Build and Test
  # ============================================================================

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Unit Tests
  # ============================================================================

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short --cov=fsrsync --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # ============================================================================
  # Integration Tests with Docker Lab
  # ============================================================================

  integration-tests:
    name: Integration Tests (Docker Lab)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    strategy:
      matrix:
        scenario:
          - basic-sync
          - conflict-resolution
          - large-file-transfer
          - network-failure-recovery
          - multi-peer-sync
          - bandwidth-throttling
          - concurrent-operations
          - data-integrity

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Start Docker Lab
        run: |
          docker-compose -f docker-compose.lab.yml up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Check service health
        run: |
          docker-compose -f docker-compose.lab.yml ps
          docker-compose -f docker-compose.lab.yml logs --tail=20

      - name: Run scenario - ${{ matrix.scenario }}
        run: |
          docker-compose -f docker-compose.lab.yml exec -T test-runner \
            pytest tests/scenarios/test_${{ matrix.scenario }}.py -v --tb=short

      - name: Collect logs on failure
        if: failure()
        run: |
          docker-compose -f docker-compose.lab.yml logs > docker-logs-${{ matrix.scenario }}.txt
          echo "Logs collected to docker-logs-${{ matrix.scenario }}.txt"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: docker-logs-${{ matrix.scenario }}
          path: docker-logs-${{ matrix.scenario }}.txt

      - name: Cleanup Docker Lab
        if: always()
        run: docker-compose -f docker-compose.lab.yml down -v

  # ============================================================================
  # Performance Tests
  # ============================================================================

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start Docker Lab
        run: docker-compose -f docker-compose.lab.yml up -d

      - name: Wait for services
        run: sleep 30

      - name: Run performance test suite
        run: |
          docker-compose -f docker-compose.lab.yml exec -T test-runner \
            pytest tests/performance -v --tb=short --json-report --json-report-file=perf-report.json

      - name: Analyze performance results
        run: |
          python scripts/analyze_performance.py perf-report.json

      - name: Upload performance report
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: perf-report.json

      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.lab.yml down -v

  # ============================================================================
  # Code Quality
  # ============================================================================

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black mypy

      - name: Run pylint
        run: pylint fsrsync --exit-zero

      - name: Run flake8
        run: flake8 fsrsync --max-line-length=120 --exit-zero

      - name: Check code formatting with black
        run: black --check fsrsync --line-length=120 || true

      - name: Type checking with mypy
        run: mypy fsrsync --ignore-missing-imports || true

  # ============================================================================
  # Security Scanning
  # ============================================================================

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run pip-audit for dependencies
        run: |
          pip install pip-audit
          pip-audit --output sarif --output-file pip-audit.json || true

  # ============================================================================
  # Documentation
  # ============================================================================

  documentation:
    name: Documentation Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install sphinx sphinx-rtd-theme

      - name: Build documentation
        run: |
          cd docs
          make html || echo "Documentation build skipped (not configured)"

      - name: Upload documentation
        uses: actions/upload-artifact@v3
        with:
          name: documentation
          path: docs/_build/html/

  # ============================================================================
  # Final Reporting
  # ============================================================================

  test-report:
    name: Test Report Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - unit-tests
      - integration-tests
      - performance-tests
      - code-quality
      - security

    steps:
      - name: Check test results
        run: |
          echo "## FSRsync Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Tests: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any tests failed
        if: |
          needs.unit-tests.result == 'failure' ||
          needs.integration-tests.result == 'failure' ||
          needs.performance-tests.result == 'failure'
        run: exit 1
