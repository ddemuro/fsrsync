[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    unit: Unit tests
    integration: Integration tests (require Docker environment)
    performance: Performance tests
    slow: Slow running tests
    docker: Tests that require Docker environment
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
norecursedirs = .git .venv venv env __pycache__ dist build *.egg-info
